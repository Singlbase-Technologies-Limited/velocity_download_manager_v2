[package]
name = "velocity-desktop-v2"
description = "Tauri desktop shell for Velocity Download Manager V2"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "velocity_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Packaging builds the app as the released app (#81, docs/PACKAGING.md).
[features]
release-identity = ["velocity-core/release-identity"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the tray and close to tray (#29).
tauri = { version = "2", features = ["tray-icon"] }
# Pinned exactly: 2.5.2 approved by the PO on 2026-10-22 (#27).
tauri-plugin-single-instance = "=2.5.2"
# Used from Rust only, never granted to the web layer (PO decisions on #29 and #60, 2026-10-29).
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
serde.workspace = true
serde_json.workspace = true
# The app's log and crash logs (#28): events are kept in memory, redacted, by velocity-core's layer.
tracing.workspace = true
tracing-subscriber.workspace = true
velocity-core = { path = "../crates/velocity-core" }
# The engine's client and supervisor (ADR-0012): the engine itself runs as its own process.
velocity-transfer = { path = "../crates/velocity-transfer" }
# The torrent helper's client and supervisor only, without libtorrent (PO decision on #58).
velocity-torrent = { path = "../crates/velocity-torrent", default-features = false }
