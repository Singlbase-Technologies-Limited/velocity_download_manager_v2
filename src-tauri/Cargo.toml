[package]
name = "velocity-desktop-v2"
description = "Tauri desktop shell for Velocity Download Manager V2"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "velocity_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Pinned exactly: 2.5.2 approved by the PO on 2026-10-22 (#27).
tauri-plugin-single-instance = "=2.5.2"
serde.workspace = true
serde_json.workspace = true
velocity-core = { path = "../crates/velocity-core" }
# The engine's client and supervisor (ADR-0012): the engine itself runs as its own process.
velocity-transfer = { path = "../crates/velocity-transfer" }
# The torrent helper's client and supervisor only, without libtorrent (PO decision on #58).
velocity-torrent = { path = "../crates/velocity-torrent", default-features = false }
