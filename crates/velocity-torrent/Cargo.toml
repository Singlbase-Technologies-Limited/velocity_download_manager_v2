[package]
name = "velocity-torrent"
description = "The torrent engine of Velocity Download Manager V2: libtorrent in a supervised helper process (ADR-0014)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# velocity-lt is the only crate that calls libtorrent (ADR-0002); velocity-child is the
# child-process layer shared with the direct-download engine.
[dependencies]
velocity-core = { path = "../velocity-core" }
velocity-child = { path = "../velocity-child" }
velocity-lt = { path = "../velocity-lt", optional = true }

# `engine` is libtorrent itself, for the helper program. The app depends on this crate without
# it, for the helper's client and supervisor only, and never links libtorrent (PO decision on
# #58).
[features]
default = ["engine"]
engine = ["dep:velocity-lt"]

[[bin]]
name = "velocity-torrent"
path = "src/main.rs"
required-features = ["engine"]

[dev-dependencies]
velocity-test-http = { path = "../velocity-test-http" }
serde_json.workspace = true
sha2.workspace = true
