# Pull-request checks (tier 1 in docs/CI.md). The `select` job decides from the changed paths which
# jobs run (scripts/ci-select.mjs, the same rules as `pnpm check:pr`) and writes every decision with
# its reason to the run summary. Skipped jobs are skipped by `if:` (they report success); path
# filters are never used, so `ci-required` always reports.
#
# Failure collection (#91, docs/CI_DIAGNOSTICS.md): every check runs to completion, each job writes
# a report of its checks (`if: !cancelled()`), and `ci-required` turns them into one table and the
# `ci-diagnostics` artifact. It fails unless every mandatory check passed or was deselected.
#
# Runs on every pull request into `main`, against its base commit. It can also be started by hand
# on a branch, against a `base` commit given (#204's manual-only arrangement ended on 2026-10-31,
# when the repository went public and its minutes became free, #236).
name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Compare with this commit, as a pull request would (for example main's)
        required: true

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select jobs
    runs-on: ubuntu-latest
    # Most of it is check:notices fetching every target's crates (#76).
    timeout-minutes: 10
    env:
      CI_REPORT_PATH: ${{ github.workspace }}/../ci-checks.json
    outputs:
      code: ${{ steps.select.outputs.rust == 'true' || steps.select.outputs.frontend == 'true' }}
      rust: ${{ steps.select.outputs.rust }}
      docs: ${{ steps.select.outputs.docs }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - id: select
        name: Decide which jobs run
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          # `cargo metadata --no-deps` only reads manifests; the runner's stable toolchain is enough,
          # so this job doesn't download the pinned one.
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-select.mjs --base "$BASE_SHA"
      # The docs check takes about a second, so it runs here instead of in its own job: GitHub bills
      # every job rounded up to a whole minute, and this job already has the checkout and Node.
      - id: links
        name: Docs (check:links)
        if: steps.select.outputs.docs == 'true'
        run: node scripts/check-links.mjs
      # The agent guidance check (#88) takes under a second, and any path can change its result (a
      # rule's glob dies when its folder goes), so it runs on every pull request, here.
      - id: guidance
        name: Agent guidance (check:guidance)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/check-guidance.mjs
      # The third-party notices and the licence check (#76, docs/LICENSING.md): every shipped
      # component's licence is allowed, and THIRD_PARTY_NOTICES.md matches the dependency graphs.
      # Here, on a fresh runner and in about a minute: in the Linux job, after check:fast's build,
      # downloading every target's crates filled the disk (run 41091551241). Once is enough: the
      # graphs are the same on every OS (`cargo tree --target all`). The runner's stable cargo reads
      # the graphs, as for the selection.
      - id: notices
        name: Third-party notices (check:notices)
        if: ${{ !cancelled() && steps.select.outputs.rust == 'true' }}
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check:notices
      - name: Write the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-report.mjs job --job select --infra checkout,node --step-check "select=Job selection" --step-check "notices=Third-party notices (check:notices)"
      - name: Upload the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-select-${{ github.run_attempt }}
          path: ci-reports/report-select.json
          retention-days: 7

  code:
    name: Code checks (check:pr)
    needs: select
    # Runs when the selection decided it is needed. Until #76 it ran even after a failed docs check,
    # so that one broken link wouldn't hide every code failure (#91's fixture A).
    # Only after the selection succeeded, its docs and guidance checks included: a broken link
    # or guidance rule, found in seconds, stops the run before the long checks (PO decision on
    # #76, 2026-10-30): a red run costs a minute, not half an hour. The job is then reported BLOCKED by `select`.
    if: ${{ needs.select.result == 'success' && needs.select.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Long enough for a cold build of Boost and libtorrent (#205); a warm run takes far less.
    timeout-minutes: 90
    env:
      # Incremental compilation only helps repeated local builds; in CI it costs time and cache space.
      CARGO_INCREMENTAL: 0
      CI_REPORT_PATH: ${{ github.workspace }}/../ci-checks.json
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The hosted runner has about 14 GB free, and a cold build of Boost and libtorrent plus
      # check:fast's debug build filled it twice, the second time while saving the Rust cache
      # (runs 41091551241 and 41101400776, #76). Toolchains V2 never uses go first: .NET, the
      # Android SDK, GHC and CodeQL, about 20 GB.
      - name: Free disk space
        if: ${{ needs.select.outputs.rust == 'true' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - id: setup
        uses: ./.github/actions/setup
        with:
          rust: ${{ needs.select.outputs.rust }}
      # The SFTP tests' OpenSSH server, and a password-login server they can't start themselves
      # (#53, scripts/ci-sftp-server.sh). Only when Rust runs.
      - id: sftp
        name: SFTP test servers
        if: ${{ needs.select.outputs.rust == 'true' }}
        run: bash scripts/ci-sftp-server.sh
      - id: checks
        name: Run the selected checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          RUST: ${{ needs.select.outputs.rust }}
        run: |
          # Without Rust, check:pr only reads manifests (`cargo metadata`); the runner's stable
          # toolchain does that without downloading the pinned one.
          if [ "$RUST" != true ]; then export RUSTUP_TOOLCHAIN=stable; fi
          node scripts/check-pr.mjs --base "$BASE_SHA"
      # check:pr builds the native libraries before any Rust check (#35), so this job is also the
      # Linux native build; its record is the evidence.
      # The native libraries as soon as they were built, even if a later check failed (#205), so a
      # rerun doesn't build Boost and libtorrent again.
      - name: Save the native libraries
        if: ${{ !cancelled() && needs.select.outputs.rust == 'true' && steps.setup.outputs.native-cache-hit != 'true' && hashFiles('target/native/*/libtorrent-info.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.native-cache-key }}
          path: target/native
      - name: Upload build-info.json
        if: ${{ !cancelled() && hashFiles('target/native/x86_64-unknown-linux-gnu/build-info.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-linux
          path: target/native/x86_64-unknown-linux-gnu/build-info.json
          retention-days: 7
      - name: Write the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-report.mjs job --job code --infra checkout,setup,sftp --step-check "checks=Code checks"
      - name: Upload the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-code-${{ github.run_attempt }}
          path: ci-reports/report-code.json
          retention-days: 7

  # The Windows native build and the libcurl layer's tests (#35, docs/BUILDING_NATIVE.md): only
  # when the native inputs, CI files or an unknown path change (scripts/checks-lib.mjs). It verifies
  # every source's SHA-256 and signature, builds, checks `curl -V` against the lock file, uploads
  # build-info.json, then links velocity-curl and runs its tests, including the start check. Linux
  # gets the same from the code job, whose check:pr runs the native build first.
  native-windows:
    name: Native build and libcurl tests (Windows)
    needs: select
    # Only after the selection succeeded, its docs and guidance checks included: a broken link
    # or guidance rule, found in seconds, stops the run before the long checks (PO decision on
    # #76, 2026-10-30): a red run costs a minute, not half an hour. The job is then reported BLOCKED by `select`.
    if: ${{ needs.select.result == 'success' && needs.select.outputs.native == 'true' }}
    runs-on: windows-latest
    # Long enough for a cold build of Boost and libtorrent (#205); a warm run takes far less.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI_REPORT_PATH: ${{ github.workspace }}/../ci-checks.json
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - id: toolchain
        name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - id: native
        uses: ./.github/actions/native
      - id: build
        name: Native build (native:build)
        run: node scripts/native/build.mjs
      # The native libraries as soon as they were built, even if a later check failed (#205), so a
      # rerun doesn't build Boost and libtorrent again.
      - name: Save the native libraries
        if: ${{ !cancelled() && steps.native.outputs.cache-hit != 'true' && hashFiles('target/native/*/libtorrent-info.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.native.outputs.cache-key }}
          path: target/native
      - name: Upload build-info.json
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-windows
          path: target/native/x86_64-pc-windows-msvc/build-info.json
          retention-days: 7
      - id: curl-tests
        name: libcurl layer tests (cargo test -p velocity-curl)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test -p velocity-curl --no-fail-fast
      # The path users take (#69): the test CA in the machine's Root store, removed afterwards. It
      # needs an administrator, which the runner is; locally the test is ignored.
      - id: store-test
        name: Windows certificate-store test (cargo test -p velocity-curl --test windows_store -- --ignored)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test -p velocity-curl --test windows_store -- --ignored --nocapture
      - name: Write the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-report.mjs job --job native-windows --infra checkout,node,toolchain --step-check "build=Native build (Windows)" --step-check "curl-tests=libcurl layer tests (Windows)" --step-check "store-test=Windows certificate-store test"
      - name: Upload the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-native-windows-${{ github.run_attempt }}
          path: ci-reports/report-native-windows.json
          retention-days: 7

  ci-required:
    name: ci-required
    needs: [select, code, native-windows]
    # Not `always()`: that also runs in a run cancelled because a newer push superseded it, and
    # reports a failure there (seen on demo PR #107). `!cancelled()` still runs after failures and
    # skips, so a real failure is always reported.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      # A job that died before uploading has no report; the summary then classifies it from its
      # result (INFRA), so a missing artifact must not stop this step.
      - name: Download the job reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: ci-reports
          # One folder per artifact, so each attempt of a job keeps its own report (#46).
          merge-multiple: false
      - name: Combine the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node scripts/ci-report.mjs summary --reports ci-reports --jobs
          '[{"id":"select","name":"Job selection","mandatory":true},
          {"id":"code","name":"Code checks","mandatory":true,"selectedBy":"select","selectedOutput":"code"},
          {"id":"native-windows","name":"Native build and libcurl tests (Windows)","mandatory":true,"selectedBy":"select","selectedOutput":"native"}]'
      - name: Upload ci-diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics
          path: ci-diagnostics.json
          retention-days: 7
