# Keeps the SHA-pinned GitHub Actions current (docs/CI.md, "Permissions and supply chain").
# Monthly and grouped into one PR, so updates cost one CI run, not one per action. Each update is
# an ordinary PR that the PO reviews. Cargo and npm have no version updates here: they get
# Dependabot's security-fix PRs only, a repository setting (PO decision on #75), and other changes
# need PO approval (#9). The advisory process is in docs/SECURITY.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
