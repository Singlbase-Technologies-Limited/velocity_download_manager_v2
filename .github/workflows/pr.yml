# Pull-request checks (tier 1 in docs/CI.md). The `select` job decides from the changed paths which
# jobs run (scripts/ci-select.mjs, the same rules as `pnpm check:pr`) and writes every decision with
# its reason to the run summary. Skipped jobs are skipped by `if:` (they report success); path
# filters are never used, so `ci-required` always reports. Caching and measured timings: #14.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    name: Select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.rust == 'true' || steps.select.outputs.frontend == 'true' }}
      rust: ${{ steps.select.outputs.rust }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - id: select
        name: Decide which jobs run
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # `cargo metadata --no-deps` only reads manifests; the runner's stable toolchain is enough,
          # so this job doesn't download the pinned one.
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci-select.mjs --base "$BASE_SHA"
      # The docs check takes about a second, so it runs here instead of in its own job: GitHub bills
      # every job rounded up to a whole minute, and this job already has the checkout and Node.
      - name: Docs (check:links)
        if: steps.select.outputs.docs == 'true'
        run: node scripts/check-links.mjs

  code:
    name: Code checks (check:pr)
    needs: select
    if: needs.select.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Incremental compilation only helps repeated local builds; in CI it costs time and cache space.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: ${{ needs.select.outputs.rust }}
      - name: Run the selected checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUST: ${{ needs.select.outputs.rust }}
        run: |
          # Without Rust, check:pr only reads manifests (`cargo metadata`); the runner's stable
          # toolchain does that without downloading the pinned one.
          if [ "$RUST" != true ]; then export RUSTUP_TOOLCHAIN=stable; fi
          node scripts/check-pr.mjs --base "$BASE_SHA"

  ci-required:
    name: ci-required
    needs: [select, code]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Combine the results
        env:
          SELECT: ${{ needs.select.result }}
          CODE: ${{ needs.code.result }}
        run: |
          {
            echo "### ci-required"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| select (with the docs check) | $SELECT |"
            echo "| code | $CODE |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Selection (and the docs check in that job) must succeed; code may be skipped by the
          # selection but never fail or be cancelled.
          [ "$SELECT" = success ] || { echo "Job selection or the docs check did not succeed: $SELECT"; exit 1; }
          case "$CODE" in success|skipped) ;; *) echo "Code checks did not succeed: $CODE"; exit 1 ;; esac
          echo "All selected checks passed."
