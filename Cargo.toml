[workspace]
resolver = "2"
members = ["crates/velocity-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Development builds: optimise dependencies once so the app runs at a usable
# speed, while workspace crates stay unoptimised for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
opt-level = "s"
