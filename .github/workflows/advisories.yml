# Weekly advisory check (#75, docs/SECURITY.md#dependency-advisories-75): `pnpm check:advisories`,
# cargo-deny on Cargo.lock and pnpm audit on pnpm-lock.yaml, the same command as locally. A red run
# means an advisory affects a locked dependency: assess it within the response time its severity
# sets, with the advisory-assessment issue template.
#
# Disabled while CI is paused (docs/CI.md#while-ci-is-paused) and enabled again with main.yml and
# pr.yml at the end of epic #1.
name: Advisories

on:
  schedule:
    # Mondays 04:00 UTC, an hour after the L4 slot in docs/CI.md.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: true

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    # Building cargo-deny takes most of it; the checks themselves take seconds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and the JavaScript dependencies; no Rust build, so no Tauri packages or cache.
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: Install cargo-deny
        # The version docs/DEPENDENCIES.md records. Cargo reads rust-toolchain.toml and installs that
        # toolchain first.
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories
        run: pnpm check:advisories
