# Shared job setup for the CI workflows (docs/CI.md): Node, and when Rust is needed the Tauri system
# packages (Linux only; Windows runners have what Tauri needs), the pinned toolchain and the
# restored dependency cache (one per OS), then the JavaScript dependencies.
# The cache is only restored here. Workflows on `main` save it (see main.yml), so pull requests
# never fill the 10 GB cache with per-branch copies.
name: Set up a V2 CI job
description: Node, optional Rust toolchain, Tauri packages, Rust dependency and native caches, and pnpm install

inputs:
  rust:
    description: Whether the job builds Rust ("true" or "false")
    required: true

outputs:
  rust-cache-key:
    description: The exact cache key for this toolchain and Cargo.lock
    value: ${{ steps.key.outputs.key }}
  rust-cache-hit:
    description: '"true" when the exact key was restored'
    value: ${{ steps.restore.outputs.cache-hit }}
  native-cache-key:
    description: The key target/native is cached under (#205)
    value: ${{ steps.native.outputs.cache-key }}
  native-cache-hit:
    description: '"true" when target/native was restored'
    value: ${{ steps.native.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.12.0

    - name: Install Tauri system packages
      if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash
      # A stalled first mirror (azure.archive.ubuntu.com) hung this step until it was cancelled, three
      # times on 2026-10-22 (#135). Each attempt is bounded: a healthy update takes about 6 s and the
      # install about 45 s (demo PR #137). On a failure or stall the Azure mirror is dropped from the
      # runner's mirror list, so apt uses archive.ubuntu.com (priority 2 in /etc/apt/apt-mirrors.txt,
      # written by the runner image), and the install is retried once. If that fails too, the step
      # fails as INFRA within minutes.
      run: |
        packages=(libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev)
        install() {
          sudo timeout 90 apt-get update && sudo timeout 180 apt-get install -y --no-install-recommends "${packages[@]}"
        }
        if ! install; then
          echo "::warning title=Ubuntu mirror::apt-get failed or stalled on the runner's first mirror; retrying without azure.archive.ubuntu.com (#135)"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          # A killed attempt can leave dpkg half-configured; finish that before retrying.
          sudo dpkg --configure -a
          install
        fi

    - name: Install the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy

    # One key per OS, toolchain and Cargo.lock. A new Cargo.lock falls back to the newest older key
    # (restore-keys), so a dependency bump still starts mostly warm.
    - id: key
      if: inputs.rust == 'true'
      shell: bash
      run: echo "key=rust-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}" >> "$GITHUB_OUTPUT"

    - id: restore
      if: inputs.rust == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.key.outputs.key }}
        restore-keys: rust-v1-${{ runner.os }}-
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/

    # The native libraries on their own, after the Rust cache so they take its place, and vcpkg
    # when they have to be built (#205).
    - id: native
      if: inputs.rust == 'true'
      uses: ./.github/actions/native

    # No pnpm store cache: `pnpm install --frozen-lockfile` took 4 s in CI (PR #104), less than a
    # cache restore and save would cost (PO decision on #14).
    - name: Install JavaScript dependencies
      shell: bash
      run: |
        corepack enable
        pnpm install --frozen-lockfile
