# Native libraries V2 builds and links (#35). Format and rules: docs/DEPENDENCIES.md, "Lock file";
# how they're built: docs/BUILDING_NATIVE.md. Approved by the PO on 2026-10-22 (#35).
#
# One line per library: name version source-url sha256 signature licence
#
# Each SHA-256 was computed on 2026-10-22 from a download of the URL over HTTPS. Each signature is
# the detached `<source-url>.asc` published next to the archive, verified on 2026-10-22 with gpg
# against only that library's key in keys/<name>.asc; the fingerprint is the signer's primary key.
# fetch.mjs repeats both checks on every download and refuses to build when either fails.
#
# The keys came from each project's own published source:
#   curl     https://daniel.haxx.se/mykey.asc (Daniel Stenberg, curl's release manager)
#   nghttp2  https://github.com/tatsuhiro-t.gpg (Tatsuhiro Tsujikawa, who signs nghttp2 releases)
#   openssl  https://openssl-library.org/source/pubkeys.asc (OpenSSL's release-signing keys)
#   zlib     https://madler.net/madler/pgp.html (Mark Adler, linked from zlib.net; the same
#            fingerprint as keys.openpgp.org's copy)
#
# Which libraries a target builds: TARGETS in native-lib.mjs (Windows: zlib, nghttp2, curl with
# Schannel; Linux: zlib, nghttp2, OpenSSL, curl). OpenSSL stays on the 3.5 long-term line (PO, #35).
