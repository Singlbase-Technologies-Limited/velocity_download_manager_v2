[package]
name = "velocity-transfer"
description = "The direct-download engine of Velocity Download Manager V2: probe, segments, writer and finalisation (ADR-0002)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# `test-faults` makes writes to a part file fail on demand, for the disk-full and refused-write
# tests (#74, PO decision). Test builds only: an optimised build refuses it, like velocity-curl's
# `test-ca`. Its tests live in velocity-transfer-h2c, for the reason given there.
[features]
test-faults = []

[dependencies]
velocity-core = { path = "../velocity-core" }
velocity-child = { path = "../velocity-child" }
velocity-curl = { path = "../velocity-curl" }
velocity-sftp = { path = "../velocity-sftp" }
httpdate.workspace = true
fastrand.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
velocity-test-http = { path = "../velocity-test-http" }
# The app's log, captured to check no secret reaches it (#70).
tracing.workspace = true
tracing-subscriber.workspace = true
proptest.workspace = true
