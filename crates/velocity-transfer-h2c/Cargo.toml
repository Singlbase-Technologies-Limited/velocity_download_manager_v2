[package]
name = "velocity-transfer-h2c"
description = "The direct-download engine's tests over HTTP/2 without TLS (test-only): the one place velocity-transfer is built with velocity-curl's test-h2c feature"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

# Only tests live here (#46). The test-h2c feature refuses an optimised build (PO decision on #47),
# and a dev-dependency's features reach every example of the crate that declares it, so
# velocity-transfer's own examples couldn't be built for release while its tests turned it on.
[dev-dependencies]
velocity-core = { path = "../velocity-core" }
velocity-transfer = { path = "../velocity-transfer" }
velocity-curl = { path = "../velocity-curl", features = ["test-h2c"] }
velocity-test-http = { path = "../velocity-test-http" }
