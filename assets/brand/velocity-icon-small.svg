<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Velocity Download Manager</title>
  <!-- Simplified for 16-48 px: no sheen, shadow or speed cuts; heavier strokes and a larger tile. -->
  <defs>
    <linearGradient id="tile" x1="128" y1="0" x2="896" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8C4"/>
      <stop offset="0.48" stop-color="#1D6FD8"/>
      <stop offset="1" stop-color="#2236B8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#tile)"/>
  <g fill="#FFFFFF">
    <path stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"
          d="M216 232 H392 L512 486 L632 232 H808 L512 790 Z"/>
    <rect x="300" y="842" width="424" height="86" rx="43"/>
  </g>
</svg>
