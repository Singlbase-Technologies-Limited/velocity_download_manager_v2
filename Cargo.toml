[workspace]
resolver = "2"
members = ["crates/velocity-core", "crates/velocity-curl", "crates/velocity-test-http", "crates/velocity-transfer", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-OS data directory (#27, PO-approved 2026-10-22); also used by Tauri itself.
dirs = "7.0.0"
# SQLite for the app database (PO-approved on #26, 2026-10-23). `bundled` compiles the SQLite 3.53.2
# source that ships inside libsqlite3-sys 0.38.2, the same on every platform (docs/DEPENDENCIES.md).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Numbered migrations for the app database (PO-approved on #26, 2026-10-23). No default features.
rusqlite_migration = { version = "=2.6.0", default-features = false }
# Property tests for the range scheduler, test-only (PO-approved on #42, 2026-10-23). 1.11.0 over
# 1.12.0, released 2026-10-10. Without default features: no fork or timeout support.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# libcurl's C API, for crates/velocity-curl only (PO-approved on #35, 2026-10-22). Its bundled
# build never runs: .cargo/config.toml overrides it, and velocity-curl links the Velocity-built
# libcurl (docs/BUILDING_NATIVE.md). No default features, so it pulls in no openssl-sys.
curl-sys = { version = "=0.4.91", default-features = false }
# libcurl's safe Rust API (Multi, Easy2), for crates/velocity-curl only (PO-approved on #37,
# 2026-10-22). No default features: no openssl-sys. `poll_7_68_0` declares curl_multi_poll and
# curl_multi_wakeup (libcurl 7.68+; ours is 8.23.0). Pinned below to a reviewed commit (ADR-0004).
curl = { version = "0.4.51", default-features = false, features = ["poll_7_68_0"] }

# Development builds: optimise dependencies once so the app runs at a usable
# speed, while workspace crates stay unoptimised for fast incremental rebuilds.
# The engine prototype's curl: the reviewed curl-rust commit with the fix for a crash when a Multi
# is dropped with transfers attached (curl-rust #645, after 0.4.51). Review: issue #37. curl-sys is
# pinned to the same commit because the git curl depends on its own curl-sys (two packages may not
# both link libcurl); its files are identical to the crates.io 0.4.91 there, and its build script is
# still overridden (.cargo/config.toml). Switch back to crates.io once a release includes #645.
[patch.crates-io]
curl = { git = "https://github.com/alexcrichton/curl-rust", rev = "2fb602bb1d3a34ded4548cbe8a7c7202b1ab4ba2" }
curl-sys = { git = "https://github.com/alexcrichton/curl-rust", rev = "2fb602bb1d3a34ded4548cbe8a7c7202b1ab4ba2" }

[profile.dev.package."*"]
opt-level = 1
debug = false

# Line tables keep file and line numbers in backtraces but drop variable info,
# which shrinks the multi-hundred-megabyte Tauri test artefacts and their link
# time (measured in issue #3, see docs/DEVELOPMENT.md). For a debugger session,
# override it: CARGO_PROFILE_DEV_DEBUG=true cargo build
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
opt-level = "s"
