[workspace]
resolver = "2"
members = ["crates/velocity-child", "crates/velocity-core", "crates/velocity-curl", "crates/velocity-lt", "crates/velocity-sftp", "crates/velocity-test-http", "crates/velocity-torrent", "crates/velocity-transfer", "crates/velocity-transfer-h2c", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-OS data directory (#27, PO-approved 2026-10-22); also used by Tauri itself.
dirs = "7.0.0"
# SQLite for the app database (PO-approved on #26, 2026-10-23). `bundled` compiles the SQLite 3.53.2
# source that ships inside libsqlite3-sys 0.38.2, the same on every platform (docs/DEPENDENCIES.md).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Numbered migrations for the app database (PO-approved on #26, 2026-10-23). No default features.
rusqlite_migration = { version = "=2.6.0", default-features = false }
# Windows file operations for the engine: sparse part files and the no-replace rename (PO-approved on
# #43, 2026-10-23). The same version curl and dirs already bring.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
# Unix file operations for the engine: the no-replace rename (PO-approved on #43, 2026-10-23). The
# same version Tauri already brings.
libc = "=0.2.191"
# Property tests for the range scheduler, test-only (PO-approved on #42, 2026-10-23). 1.11.0 over
# 1.12.0, released 2026-10-10. Without default features: no fork or timeout support.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# HTTP dates in `Retry-After` for the engine (PO-approved on #48, 2026-10-23). No dependencies of its own.
httpdate = "=1.0.3"
# Random spread (jitter) for the engine's retry waits (PO-approved on #48, 2026-10-23). Not for
# anything security-related. The same version Tauri's build already brought.
fastrand = "=2.5.0"
# Whole-file and piece checksums for the engine (PO-approved on #46, 2026-10-23): RustCrypto's MD5,
# SHA-1 and SHA-2 (224, 256, 384, 512). No default features: no `alloc` or `oid`, only `Digest`.
sha2 = { version = "=0.11.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
md-5 = { version = "=0.11.0", default-features = false }
# Local time for the download schedule (PO-approved on #50, 2026-10-23): the system time zone,
# with summer time. Default features: the system zone, and on Windows a bundled time-zone database.
jiff = "=0.2.38"
# Metalink documents for the core (PO-approved on #54, 2026-10-24): a streaming XML reader that never
# expands custom entities. The same version Tauri already brings (through plist), so no new crate.
# No default features: no serde, no encodings other than UTF-8.
quick-xml = { version = "=0.42.0", default-features = false }
# libcurl's C API, for crates/velocity-curl only (PO-approved on #35, 2026-10-22). Its bundled
# build never runs: .cargo/config.toml overrides it, and velocity-curl links the Velocity-built
# libcurl (docs/BUILDING_NATIVE.md). No default features, so it pulls in no openssl-sys.
curl-sys = { version = "=0.4.91", default-features = false }
# libcurl's safe Rust API (Multi, Easy2), for crates/velocity-curl only (PO-approved on #37,
# 2026-10-22). No default features: no openssl-sys. `poll_7_68_0` declares curl_multi_poll and
# curl_multi_wakeup (libcurl 7.68+; ours is 8.23.0). Pinned below to a reviewed commit (ADR-0004).
curl = { version = "0.4.51", default-features = false, features = ["poll_7_68_0"] }
# The HTTP/2 test server in crates/velocity-test-http, never shipped (PO-approved on #47,
# 2026-10-23): h2 directly rather than through hyper, run on tokio. http and bytes are h2's own
# types. tokio 1.54.1 also fixes RUSTSEC-2026-0384 in the Tauri app's tokio.
h2 = "=0.4.20"
# SFTP for the engine, in crates/velocity-sftp only (PO-approved on #53, 2026-10-24; ADR-0013, which
# replaces libssh2). ring as the crypto, as for the TLS fixture: no aws-lc-rs, no OpenSSL. `rsa`
# keeps RSA host and login keys working; its open Marvin advisory (RUSTSEC-2023-0071) is accepted
# and recorded in docs/DEPENDENCIES.md.
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util"] }
http = "=1.5.0"
bytes = "=1.12.1"
# The TLS fixture in crates/velocity-test-http, never shipped (PO-approved on #69, 2026-10-24):
# rustls on tokio terminates TLS for the test servers, with ring as its crypto provider; rcgen makes
# the test CA, the certificate variants and the revocation list. No default features, so rustls
# brings no aws-lc-rs.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# The C++ bridge to libtorrent, in crates/velocity-lt only (PO-approved on #62, 2026-10-26). The same
# version V1's bridge used. cxx-build compiles the shim against the vcpkg-built libtorrent.
cxx = "=1.0.205"
cxx-build = "=1.0.205"

# Development builds: optimise dependencies once so the app runs at a usable
# speed, while workspace crates stay unoptimised for fast incremental rebuilds.
# The engine prototype's curl: the reviewed curl-rust commit with the fix for a crash when a Multi
# is dropped with transfers attached (curl-rust #645, after 0.4.51). Review: issue #37. curl-sys is
# pinned to the same commit because the git curl depends on its own curl-sys (two packages may not
# both link libcurl); its files are identical to the crates.io 0.4.91 there, and its build script is
# still overridden (.cargo/config.toml). Switch back to crates.io once a release includes #645.
[patch.crates-io]
curl = { git = "https://github.com/alexcrichton/curl-rust", rev = "2fb602bb1d3a34ded4548cbe8a7c7202b1ab4ba2" }
curl-sys = { git = "https://github.com/alexcrichton/curl-rust", rev = "2fb602bb1d3a34ded4548cbe8a7c7202b1ab4ba2" }

[profile.dev.package."*"]
opt-level = 1
debug = false

# Line tables keep file and line numbers in backtraces but drop variable info,
# which shrinks the multi-hundred-megabyte Tauri test artefacts and their link
# time (measured in issue #3, see docs/DEVELOPMENT.md). For a debugger session,
# override it: CARGO_PROFILE_DEV_DEBUG=true cargo build
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
opt-level = "s"
