[package]
name = "velocity-transfer"
description = "The direct-download engine of Velocity Download Manager V2: probe, segments, writer and finalisation (ADR-0002)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
velocity-core = { path = "../velocity-core" }
velocity-curl = { path = "../velocity-curl" }
httpdate.workspace = true
fastrand.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
velocity-test-http = { path = "../velocity-test-http" }
# HTTP/2 without TLS for the tests against the local HTTP/2 server (PO decision on #47).
velocity-curl = { path = "../velocity-curl", features = ["test-h2c"] }
proptest.workspace = true
