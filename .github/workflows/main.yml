# Checks on `main` after each merge (the Linux part of tier 2 in docs/CI.md; #16 adds Windows).
# This is also the only workflow that saves the Rust dependency cache, which pull requests restore,
# so it must run every L1 check and build everything the PR tier builds.
name: Main checks

on:
  push:
    branches: [main]

permissions:
  contents: read

# Every commit on main gets its own result: queue runs, never cancel them.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux checks (check:fast)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CI_REPORT_PATH: ${{ github.workspace }}/../ci-checks.json
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          rust: 'true'
      - id: checks
        name: All L1 checks
        run: node scripts/check-fast.mjs
      # Runs even when an L1 check failed, so one run reports everything (#91).
      - id: links
        name: Docs (check:links)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-links.mjs
      - id: guidance
        name: Agent guidance (check:guidance)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-guidance.mjs

      # Failure collection (#91, docs/CI_DIAGNOSTICS.md). This workflow has one job, so the report
      # and the summary run here instead of in an extra job (each job costs a billed minute).
      - name: Write the job report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-report.mjs job --job linux --infra checkout,setup --step-check "checks=L1 checks"
      - name: Summarise
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          NEEDS: '{"linux":{"result":"${{ job.status }}"}}'
        run: node scripts/ci-report.mjs summary --reports ci-reports --jobs '[{"id":"linux","name":"Linux checks","mandatory":true}]'
      - name: Upload ci-diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics
          path: ci-diagnostics.json
          retention-days: 14

      # Save only after a full green run and only when this key isn't cached yet (keys are
      # immutable). Workspace crates are removed first: they rebuild in seconds, and caching them
      # only adds size. What stays is the compiled dependencies, measured at about 365 MiB compressed.
      - name: Keep only dependency artefacts
        if: steps.setup.outputs.rust-cache-hit != 'true'
        run: |
          for d in target/debug target/release; do
            [ -d "$d" ] || continue
            find "$d/deps" "$d/build" "$d/.fingerprint" -maxdepth 1 -name '*velocity*' -exec rm -rf {} + 2>/dev/null || true
            rm -rf "$d/incremental"
            find "$d" -maxdepth 1 -type f -delete
          done
          du -sh target ~/.cargo/registry 2>/dev/null || true
      - name: Save the Rust dependency cache
        if: steps.setup.outputs.rust-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.setup.outputs.rust-cache-key }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
