<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Velocity V2</title><link rel="stylesheet" href="style.css"><style>body{width:320px;padding:14px}</style></head>
<body>
<h1><img src="icons/icon-32.png" alt="">Velocity Download Manager V2</h1>
<div id="status" class="status" role="status">Checking…</div>
<label for="mode">When the browser starts a download</label>
<select id="mode">
  <option value="auto">Send matching downloads to Velocity V2</option>
  <option value="ask">Ask me first</option>
  <option value="off">Let the browser download</option>
</select>
<form id="form">
  <label for="url">Send a link</label>
  <div class="row"><input id="url" type="url" placeholder="https://…" required><button class="primary" type="submit">Send</button></div>
  <p id="result" class="hint" role="status"></p>
</form>
<button id="options" type="button">Settings…</button>
<script src="popup.js"></script>
</body></html>
