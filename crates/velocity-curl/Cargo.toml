[package]
name = "velocity-curl"
description = "The libcurl layer of Velocity Download Manager V2: the only crate that calls libcurl (ADR-0002)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
curl.workspace = true
curl-sys.workspace = true

# Test-only: HTTP/2 without TLS, for the HTTP/2 tests (PO decision on #47). A release build
# refuses to compile with it (src/lib.rs).
[features]
test-h2c = []
# Test-only: trust a test CA file (CURLOPT_CAINFO), for the TLS tests (PO decision on #69). A
# release build refuses to compile with it (src/lib.rs).
test-ca = []

[dev-dependencies]
velocity-test-http = { path = "../velocity-test-http" }
# This crate's own tests enable the test-only features.
velocity-curl = { path = ".", features = ["test-h2c", "test-ca"] }

[build-dependencies]
serde_json.workspace = true
